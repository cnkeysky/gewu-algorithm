[workspace]
members = [
    "apps/cli",
    "crates/core",
    "crates/domain",
    "crates/llm",
    "crates/practice",
    "crates/protocol",
    "crates/storage",
    "crates/template",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/cnkeysky/gewu-algorithm"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
