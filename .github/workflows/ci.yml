name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check release version references
        run: npm run check:version

  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  clients:
    name: TypeScript, Web, and VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/template-authoring/package-lock.json
            tools/template-authoring/workbench/package-lock.json
            editors/vscode/package-lock.json
      - name: Template authoring
        working-directory: tools/template-authoring
        run: |
          npm ci
          npm test
      - name: Web workbench build
        working-directory: tools/template-authoring/workbench
        run: |
          npm ci
          npm run build
      - name: VS Code adapter
        working-directory: editors/vscode
        run: |
          npm ci
          npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/template-authoring/workbench/package-lock.json
      - name: Install workbench dependencies
        working-directory: tools/template-authoring/workbench
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build core
        run: cargo build -p gewu-cli
      - name: Run e2e
        working-directory: tools/template-authoring/workbench
        run: npm run test:e2e -- --retries=2

  dev-runner:
    name: Dev runner smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run one-command prepare
        shell: bash
        env:
          DEEPSEEK_API_KEY: ci-placeholder-1234567890
        run: node scripts/gewu-dev.mjs prepare --provider deepseek --model deepseek-v4-flash --force-install
